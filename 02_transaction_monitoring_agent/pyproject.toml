[project]
name = "transaction-monitoring-workshop"
version = "0.1.0"
description = "A transaction-monitoring agent with memory, whose assessments a named reviewer decides, with evals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0,<2",
    "langgraph>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langsmith>=0.16.2,<1",
    "python-dotenv>=1.0,<2",
    "langgraph-cli[inmem]>=0.4,<1",
    "notebook>=7,<8",
    "langchain-anthropic>=1.0,<2",
    "pydantic>=2,<3",
    "fsi-common",
    "langgraph-checkpoint-sqlite>=3.1.3,<4",
]

[tool.uv.sources]
fsi-common = { workspace = true }
