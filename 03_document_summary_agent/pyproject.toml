[project]
name = "document-summary-workshop"
version = "0.1.0"
description = "A compliance brief from a regulatory document: cited facts, a sub-agent per section, and a named reviewer who signs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "python-dotenv>=1.0,<2",
    "langgraph-cli[inmem]>=0.4,<1",
    "notebook>=7,<8",
    "langchain>=1.0,<2",
    "langchain-anthropic>=1.0,<2",
    "deepagents>=0.7,<1",
    "pydantic>=2,<3",
    "fsi-common",
]

[tool.uv.sources]
fsi-common = { workspace = true }
